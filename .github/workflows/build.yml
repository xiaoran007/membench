name: Cross-Platform Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential
    
    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install cmake
    
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: cmake --build build --config Release
    
    - name: Test run (Linux/macOS)
      run: ./build/membench 512
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: membench-${{ matrix.os }}
        path: build/membench
        if-no-files-found: ignore

  windows:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Cross-compile Windows x64 with Docker
      run: docker build --file docker/windows.Dockerfile --output type=local,dest=build/Release --progress=plain .

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: membench-windows-x64
        path: |
          build/Release/membench.exe
          build/Release/membench_memory_probe.exe
        if-no-files-found: error
